<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana Internacional - Uniguajira</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        ug: {
                            mar: '#62A7B4',       /* Azul Mar */
                            desierto: '#E0A342',  /* Amarillo Desierto */
                            flamenco: '#CA5E50',  /* Rosado Flamenco */
                            negro: '#000000',     /* Negro */
                            light: '#f8fafc',
                        }
                    },
                    backgroundImage: {
                        'world-pattern': "url('data:image/svg+xml,%3Csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cpath d=\"M50 10c-22.1 0-40 17.9-40 40s17.9 40 40 40 40-17.9 40-40-17.9-40-40-40zm0 76c-19.9 0-36-16.1-36-36s16.1-36 36-36 36 16.1 36 36-16.1 36-36 36z\" fill=\"%2362A7B4\" fill-opacity=\"0.05\"/%3E%3C/svg%3E')",
                    },
                    animation: {
                        'fly': 'fly 15s linear infinite',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        fly: {
                            '0%': { transform: 'translateX(-100%) translateY(50px) rotate(15deg)' },
                            '100%': { transform: 'translateX(100vw) translateY(-150px) rotate(15deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        
        /* Smooth UI enhancements */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(98, 167, 180, 0.1);
        }
        
        /* 3D Button Effect */
        .btn-3d {
            position: relative;
            transition: all 0.2s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
        }
        .btn-3d::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0; right: 0; height: 4px;
            background: rgba(0,0,0,0.2);
            border-radius: 0 0 inherit inherit;
        }
        .btn-3d:active::after {
            height: 0px;
            bottom: 0px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #E0A342; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #CA5E50; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #62A7B4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen bg-world-pattern flex flex-col font-sans">

    <div id="view-auth" class="flex-grow flex items-center justify-center p-4 relative z-10">
        <div class="w-full max-w-md">
            
            <!-- Logo Header -->
            <div class="text-center mb-8">
                <div class="relative inline-block">
                    <i class="fas fa-sun text-ug-desierto text-5xl absolute -top-4 -right-4 animate-spin-slow"></i>
                    <i class="fas fa-cactus text-ug-mar text-6xl relative z-10 drop-shadow-md"></i>
                </div>
                <h1 class="font-display font-black text-4xl mt-4 text-ug-negro tracking-tight">niguajira<br><span class="text-ug-desierto text-2xl font-bold">Internacional</span></h1>
                <p class="text-xs font-bold text-ug-flamenco uppercase tracking-widest mt-2">Educación Global • Impacto Local</p>

            <!-- Login / Register Card -->
            <div class="glass-panel rounded-3xl p-8">
                
                <!-- Toggle Tabs -->
                <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
                    <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-white text-ug-mar shadow-sm transition-all">Ingresar</button>
                    <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-lg font-bold text-sm text-gray-500 hover:text-ug-mar transition-all">Registrarse</button>
                </div>

                <!-- Login Form -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Correo Electrónico</label>
                        <div class="relative">

                            <input type="email" id="login-email" required class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ug-mar focus:bg-white transition" placeholder="tu@correo.com">

                    <button type="submit" class="w-full bg-ug-mar hover:bg-[#4E8893] text-white font-bold py-3 rounded-xl btn-3d mt-2">

                </form>

                <!-- Register Form (Hidden by default) -->
                <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Nombre Completo</label>
                        <input type="text" id="reg-name" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ug-desierto focus:bg-white transition" placeholder="Juan Pérez">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Correo Electrónico</label>
                        <input type="email" id="reg-email" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ug-desierto focus:bg-white transition" placeholder="tu@correo.com">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Programa</label>
                            <input type="text" id="reg-program" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ug-desierto" placeholder="Ej. Sistemas">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Semestre</label>
                            <input type="number" id="reg-semester" min="1" max="10" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ug-desierto" placeholder="1-10">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Crea una Contraseña</label>
                        <input type="password" id="reg-pass" required minlength="6" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-ug-desierto focus:bg-white transition" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-ug-desierto hover:bg-[#c98e32] text-white font-bold py-3 rounded-xl btn-3d mt-2">
                        Crear Cuenta
                    </button>
                </form>

            </div>
        </div>
    </div>

    <div id="app-container" class="flex-grow flex flex-col relative z-10 hidden">
        
        <!-- Header -->
        <header class="bg-white border-b border-gray-100 sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    
                    <!-- Branding Navbar -->
                    <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('dashboard')">
                        <i class="fas fa-cactus text-ug-mar text-2xl"></i>
                        <div class="leading-none hidden sm:block">
                            <span class="font-display font-black text-xl text-ug-negro">niguajira</span><br>
                            <span class="text-[10px] font-bold text-ug-desierto uppercase tracking-widest">Internacional</span>
                        </div>
                    </div>
                    
                    <!-- User Status Navbar -->
                    <div class="flex items-center gap-4">
                        <div class="bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-100 flex items-center gap-2" title="Tus Puntos">
                            <i class="fas fa-star text-ug-desierto"></i>
                            <span id="nav-points" class="font-bold text-ug-negro">0</span> <span class="text-xs text-gray-500 font-bold hidden sm:inline">pts</span>
                        </div>
                        
                        <div class="relative group cursor-pointer">
                            <button onclick="navigate('profile')" class="w-10 h-10 rounded-full border-2 border-ug-mar overflow-hidden hover:opacity-80 transition">
                                <img id="nav-avatar" src="https://placehold.co/100/62A7B4/white?text=U" alt="Avatar" class="w-full h-full object-cover">
                            </button>
                            <button onclick="logout()" class="absolute right-0 top-full mt-2 w-32 bg-white rounded-xl shadow-lg border border-gray-100 py-2 text-sm font-bold text-ug-flamenco hidden group-hover:block hover:bg-gray-50 text-left px-4">

        <!-- Main Layout with Navigation -->
        <div class="flex-grow flex max-w-7xl mx-auto w-full">
            
            <!-- Sidebar / Bottom Nav -->
            <nav class="bg-white shadow-[0_-5px_20px_rgba(0,0,0,0.05)] md:shadow-none md:w-64 fixed bottom-0 w-full md:relative md:flex-col flex justify-around md:justify-start z-30 md:border-r border-gray-100 pb-safe md:pb-0">
                <div class="md:p-6 md:block hidden">
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Navegación</h2>
                </div>
                
                <button onclick="navigate('dashboard')" id="nav-btn-dashboard" class="nav-btn flex flex-col md:flex-row items-center gap-1 md:gap-3 p-3 md:px-6 md:py-4 w-full text-gray-400 hover:text-ug-mar hover:bg-teal-50/50 transition-colors border-t-2 md:border-t-0 md:border-l-4 border-transparent">
                    <i class="fas fa-compass text-xl"></i>
                    <span class="text-[10px] md:text-sm font-bold tracking-wide">Inicio</span>
                </button>
                
                <button onclick="navigate('challenges')" id="nav-btn-challenges" class="nav-btn flex flex-col md:flex-row items-center gap-1 md:gap-3 p-3 md:px-6 md:py-4 w-full text-gray-400 hover:text-ug-desierto hover:bg-amber-50/50 transition-colors border-t-2 md:border-t-0 md:border-l-4 border-transparent">
                    <i class="fas fa-map-marked-alt text-xl"></i>
                    <span class="text-[10px] md:text-sm font-bold tracking-wide">Retos</span>

                <button onclick="navigate('ranking')" id="nav-btn-ranking" class="nav-btn flex flex-col md:flex-row items-center gap-1 md:gap-3 p-3 md:px-6 md:py-4 w-full text-gray-400 hover:text-ug-flamenco hover:bg-rose-50/50 transition-colors border-t-2 md:border-t-0 md:border-l-4 border-transparent">

                    <span class="text-[10px] md:text-sm font-bold tracking-wide">Ranking</span>

                <button onclick="navigate('profile')" id="nav-btn-profile" class="nav-btn flex flex-col md:flex-row items-center gap-1 md:gap-3 p-3 md:px-6 md:py-4 w-full text-gray-400 hover:text-ug-mar hover:bg-teal-50/50 transition-colors border-t-2 md:border-t-0 md:border-l-4 border-transparent">

                </button>
                
                <div id="admin-menu-container" class="mt-auto hidden md:block p-6 border-t border-gray-100">

            <!-- Dynamic Content Area -->

    <div id="global-modal" class="fixed inset-0 bg-ug-negro/80 z-[70] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl transform transition-all relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-ug-flamenco z-10 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center transition">
                <i class="fas fa-times"></i>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Using Demo Environment Paths)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'uniguajira-semana-intl-v2';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "demo", projectId: "demo" };
        
        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase init error", e);
        }

        // Base Paths for Firestore based on Rules
        const USERS_PATH = `artifacts/${appId}/public/data/users`;
        const CHALLENGES_PATH = `artifacts/${appId}/public/data/challenges`;

        // State variables
        window.currentUser = null;
        window.allUsers = [];
        window.allChallenges = [];
        window.currentView = '';

        // Definitions
        const LEVELS = [
            { name: 'Explorador Internacional', min: 0, icon: 'fa-hiking', color: 'text-gray-500' },
            { name: 'Viajero Cultural', min: 150, icon: 'fa-suitcase-rolling', color: 'text-ug-mar' },
            { name: 'Embajador Global', min: 400, icon: 'fa-passport', color: 'text-ug-desierto' },
            { name: 'Líder Internacional', min: 700, icon: 'fa-globe-americas', color: 'text-ug-flamenco' }
        ];

        const BADGES_DEF = {
            'b_first': { id: 'b_first', title: 'Primer Vuelo', desc: 'Completaste tu primer reto.', icon: 'fa-paper-plane', color: 'bg-ug-mar' },
            'b_social': { id: 'b_social', title: 'Creador Cultural', desc: 'Misión de redes sociales.', icon: 'fa-hashtag', color: 'bg-ug-flamenco' },
            'b_smart': { id: 'b_smart', title: 'Sabio del Mundo', desc: 'Reto de conocimiento.', icon: 'fa-lightbulb', color: 'bg-ug-desierto' },
            'b_star': { id: 'b_star', title: 'Destacado', desc: 'Alcanzaste 500 puntos.', icon: 'fa-star', color: 'bg-ug-negro' }
        };

        // --- Custom Authentication System (Base64 encoding for obfuscation) ---
        // We use Base64 to obscure plain text data in the DB as requested, 
        // acting as a custom Auth layer.
        const encode64 = str => btoa(encodeURIComponent(str));
        const decode64 = str => decodeURIComponent(atob(str));

        window.switchAuthTab = function(tab) {
            if(tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('tab-login').classList.replace('text-gray-500', 'text-ug-mar');
                document.getElementById('tab-login').classList.replace('bg-transparent', 'bg-white');
                document.getElementById('tab-register').classList.replace('text-ug-mar', 'text-gray-500');
                document.getElementById('tab-register').classList.replace('bg-white', 'bg-transparent');
            } else {
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('tab-register').classList.replace('text-gray-500', 'text-ug-mar');
                document.getElementById('tab-register').classList.replace('bg-transparent', 'bg-white');
                document.getElementById('tab-login').classList.replace('text-ug-mar', 'text-gray-500');
                document.getElementById('tab-login').classList.replace('bg-white', 'bg-transparent');
            }
        };

        window.handleRegister = async function(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const pass = document.getElementById('reg-pass').value;
            const name = document.getElementById('reg-name').value.trim();
            const program = document.getElementById('reg-program').value.trim();
            const semester = document.getElementById('reg-semester').value;

            // Simple validation
            if(pass.length < 6) return showToast("La contraseña debe tener 6+ caracteres", "error");

            try {
                // Encode to use as Unique ID and protect data
                const uid = encode64(email);
                const userRef = doc(db, USERS_PATH, uid);
                
                // Check if exists
                const snap = await getDoc(userRef);
                if(snap.exists()) {
                    return showToast("Este correo ya está registrado.", "error");
                }

                // Identify Admin
                const role = email === 'josearregocesfreyles@gmail.com' ? 'admin' : 'student';

                const newUserData = {
                    uid: uid,
                    emailEncoded: encode64(email),
                    passEncoded: encode64(pass), // Obfuscated password
                    name: name,
                    program: program,
                    semester: semester,
                    role: role,
                    points: 0,
                    badges: [],
                    challengesCompleted: [],
                    avatarUrl: `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(name)}&backgroundColor=62A7B4,E0A342,CA5E50`
                };

                await setDoc(userRef, newUserData);
                showToast("¡Cuenta creada con éxito!", "success");
                
                // Auto login
                localStorage.setItem(`session_${appId}`, uid);
                loadApp(newUserData);

            } catch (err) {
                console.error(err);
                showToast("Error en el servidor al registrar.", "error");
            }
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;

            try {
                const uid = encode64(email);
                const userRef = doc(db, USERS_PATH, uid);
                const snap = await getDoc(userRef);

                if(!snap.exists()) {
                    return showToast("Correo o contraseña incorrectos.", "error");
                }

                const userData = snap.data();
                if(userData.passEncoded !== encode64(pass)) {
                    return showToast("Correo o contraseña incorrectos.", "error");
                }

                showToast(`¡Bienvenido de nuevo, ${userData.name.split(' ')[0]}!`, "success");
                localStorage.setItem(`session_${appId}`, uid);
                loadApp(userData);

            } catch (err) {
                console.error(err);
                showToast("Error al iniciar sesión.", "error");
            }
        };

        window.logout = function() {
            localStorage.removeItem(`session_${appId}`);
            window.currentUser = null;
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('view-auth').classList.remove('hidden');
            document.getElementById('form-login').reset();
            document.getElementById('form-register').reset();
            switchAuthTab('login');
        };

        // --- Init Logic ---
        async function checkSession() {
            const storedUid = localStorage.getItem(`session_${appId}`);
            if(storedUid) {
                try {
                    const snap = await getDoc(doc(db, USERS_PATH, storedUid));
                    if(snap.exists()) {
                        loadApp(snap.data());
                    } else {
                        logout();
                    }
                } catch(e) {
                    console.error("Session check failed", e);
                }
            }
        }
        
        // Run on load
        window.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });


        // --- STREAMING_CHUNK: App Flow & Realtime Data ---
        function loadApp(userData) {
            window.currentUser = userData;
            
            // UI Toggle
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            // Set basic nav info
            document.getElementById('nav-avatar').src = userData.avatarUrl;
            
            // Admin controls visibility
            if(userData.role === 'admin') {
                document.getElementById('admin-menu-container').classList.remove('hidden');
                document.getElementById('admin-mobile-btn').classList.remove('hidden');
            } else {
                document.getElementById('admin-menu-container').classList.add('hidden');
                document.getElementById('admin-mobile-btn').classList.add('hidden');
            }

            setupRealtimeListeners();
            navigate('dashboard');
        }

        function setupRealtimeListeners() {
            if(!window.currentUser) return;

            // 1. Current User Listener
            onSnapshot(doc(db, USERS_PATH, window.currentUser.uid), (docSnap) => {
                if(docSnap.exists()){
                    const oldPts = window.currentUser.points || 0;
                    window.currentUser = docSnap.data();
                    
                    document.getElementById('nav-points').textContent = window.currentUser.points || 0;
                    
                    // Level up check
                    const oldLvl = getLevelData(oldPts);
                    const newLvl = getLevelData(window.currentUser.points);
                    if(oldLvl.name !== newLvl.name) showToast(`¡Subiste de nivel a ${newLvl.name}!`, "success");
                    
                    // Badge check
                    if(window.currentUser.points >= 500 && !(window.currentUser.badges||[]).includes('b_star')) {
                        awardBadge('b_star');
                    }

                    if(window.currentView === 'dashboard') renderDashboard();
                    if(window.currentView === 'profile') renderProfile();
                }
            });

            // 2. All Users Listener (for Ranking & Admin)
            onSnapshot(collection(db, USERS_PATH), (snapshot) => {
                window.allUsers = [];
                snapshot.forEach(doc => window.allUsers.push(doc.data()));

                if(window.currentView === 'admin') renderAdmin();

            onSnapshot(collection(db, CHALLENGES_PATH), (snapshot) => {
                window.allChallenges = [];
                snapshot.forEach(doc => window.allChallenges.push({ id: doc.id, ...doc.data() }));
                
                // If no challenges exist yet (first load), create some defaults automatically
                if(window.allChallenges.length === 0 && window.currentUser.role === 'admin') {

        // --- Helpers ---
        function getLevelData(points) {
            let current = LEVELS[0], next = LEVELS[1];
            for (let i = 0; i < LEVELS.length; i++) {
                if (points >= LEVELS[i].min) {
                    current = LEVELS[i];
                    next = LEVELS[i+1] || null;
                }
            }
            let progress = 100;
            if (next) {
                const range = next.min - current.min;
                const earned = points - current.min;
                progress = Math.min(100, Math.max(0, (earned / range) * 100));
            }
            return { current, next, progress };
        }

        window.showToast = function(msg, type="info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-ug-mar',
                error: 'bg-ug-flamenco',
                info: 'bg-ug-negro',
                warning: 'bg-ug-desierto'
            };
            const icons = {
                success: 'fa-check-circle', error: 'fa-exclamation-triangle',
                info: 'fa-info-circle', warning: 'fa-exclamation-circle'
            };

            toast.className = `${colors[type] || colors.info} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-x-full font-bold text-sm`;
            toast.innerHTML = `<i class="fas ${icons[type]}"></i> <span>${msg}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full'), 10);
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

                                    <div>

                                        <h2 class="text-3xl font-display font-black uppercase tracking-tight">${u.name}</h2>
                                    </div>
                                    <i class="fas fa-qrcode text-4xl opacity-50"></i>
                                </div>
                                
                                <div class="grid grid-cols-2 gap-y-4 gap-x-8 text-sm">
                                    <div>
                                        <p class="text-[10px] text-white/60 uppercase tracking-widest font-bold">Programa</p>
                                        <p class="font-bold uppercase tracking-wide">${u.program}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] text-white/60 uppercase tracking-widest font-bold">Semestre</p>
                                        <p class="font-bold uppercase tracking-wide">${u.semester}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] text-white/60 uppercase tracking-widest font-bold">Status</p>
                                        <p class="font-bold text-ug-desierto uppercase tracking-wide bg-ug-negro/30 inline-block px-2 py-0.5 rounded">${lvl.current.name}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] text-white/60 uppercase tracking-widest font-bold">Millas (Puntos)</p>
                                        <p class="font-black text-xl">${u.points||0}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BADGES -->
                    <div class="glass-panel rounded-3xl p-8 shadow-sm">
                        <div class="flex items-center justify-between mb-8 border-b border-gray-100 pb-4">
                            <h3 class="text-xl font-display font-black text-ug-negro uppercase tracking-tight">
                                Colección de Sellos
                            </h3>
                            <span class="bg-ug-negro text-white px-3 py-1 rounded-lg text-sm font-bold shadow-inner">
                                ${(u.badges||[]).length} / ${Object.keys(BADGES_DEF).length}
                            </span>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            ${badgesHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- STREAMING_CHUNK: Admin Panel ---
        function renderAdmin() {
            if(!window.currentUser || window.currentUser.role !== 'admin') return navigate('dashboard');
            
            const main = document.getElementById('main-content');
            const totalP = window.allUsers.reduce((s,u)=>s+(u.points||0), 0);
            
            main.innerHTML = `
                <div class="max-w-6xl mx-auto space-y-8">
                    <!-- Admin Header -->
                    <div class="bg-ug-negro text-white p-8 rounded-3xl shadow-xl flex justify-between items-center relative overflow-hidden btn-3d">
                        <i class="fas fa-cogs absolute -right-10 -bottom-10 text-9xl opacity-10"></i>
                        <div class="relative z-10">
                            <h2 class="text-3xl font-display font-black uppercase tracking-tight flex items-center gap-3">
                                <i class="fas fa-shield-alt text-ug-desierto"></i> Panel ORI
                            </h2>
                            <p class="text-gray-400 font-medium mt-1">Control General de la Semana Internacional</p>
                        </div>
                        <div class="text-right hidden md:block">
                            <p class="text-[10px] uppercase text-gray-500 font-bold tracking-widest">Admin Global</p>
                            <p class="font-bold text-ug-mar">${window.currentUser.emailEncoded ? decode64(window.currentUser.emailEncoded) : 'Admin'}</p>
                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Usuarios</p>
                            <p class="text-3xl font-black text-ug-mar">${window.allUsers.length}</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Puntos Repartidos</p>
                            <p class="text-3xl font-black text-ug-desierto">${totalP}</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Retos Activos</p>
                            <p class="text-3xl font-black text-ug-flamenco">${window.allChallenges.length}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        
                        <!-- Create Challenge Form -->
                        <div class="glass-panel p-6 rounded-3xl shadow-sm">
                            <h3 class="font-black uppercase text-ug-negro mb-6 border-b border-gray-100 pb-2">Crear Nuevo Reto</h3>
                            <form onsubmit="createChallenge(event)" class="space-y-4">
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Título</label>
                                    <input id="new-c-title" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-ug-mar">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Descripción</label>
                                    <textarea id="new-c-desc" required class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none focus:border-ug-mar" rows="2"></textarea>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Puntos</label>
                                        <input type="number" id="new-c-pts" required min="10" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Color</label>
                                        <select id="new-c-color" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm outline-none">
                                            <option value="bg-ug-mar">Azul Mar</option>
                                            <option value="bg-ug-desierto">Amarillo</option>
                                            <option value="bg-ug-flamenco">Rosado</option>
                                            <option value="bg-ug-negro">Negro</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="w-full bg-ug-negro hover:bg-gray-800 text-white font-bold py-3 rounded-xl text-sm btn-3d mt-2">Guardar Reto</button>
                            </form>
                            
                            <h4 class="font-bold text-xs uppercase text-gray-400 mt-8 mb-4">Retos Actuales</h4>
                            <div class="space-y-2 max-h-48 overflow-y-auto pr-2 custom-scrollbar">
                                ${window.allChallenges.map(c => `
                                    <div class="flex justify-between items-center p-2 bg-gray-50 rounded border border-gray-100 text-sm">
                                        <span class="font-bold text-gray-700 truncate">${c.title}</span>
                                        <button onclick="deleteChallenge('${c.id}')" class="text-red-500 hover:bg-red-50 p-1 rounded"><i class="fas fa-trash"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Users Table -->
                        <div class="glass-panel p-0 rounded-3xl shadow-sm lg:col-span-2 overflow-hidden flex flex-col">
                            <div class="p-6 bg-white border-b border-gray-100 flex justify-between items-center">
                                <h3 class="font-black uppercase text-ug-negro">Directorio Estudiantil</h3>
                            </div>
                            <div class="overflow-auto max-h-[500px] flex-grow">
                                <table class="w-full text-left text-sm border-collapse">
                                    <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                                        <tr class="text-[10px] uppercase text-gray-500 tracking-widest">
                                            <th class="py-3 px-4">Estudiante</th>
                                            <th class="py-3 px-4">Info</th>
                                            <th class="py-3 px-4 text-center">Pts</th>
                                            <th class="py-3 px-4 text-center">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 bg-white">
                                        ${window.allUsers.map(u => `
                                            <tr class="hover:bg-gray-50">
                                                <td class="py-3 px-4">
                                                    <p class="font-bold text-gray-800">${u.name}</p>
                                                    <p class="text-[10px] text-gray-400 font-mono">${decode64(u.emailEncoded)}</p>
                                                </td>
                                                <td class="py-3 px-4 text-xs text-gray-500">${u.program}</td>
                                                <td class="py-3 px-4 text-center font-black text-ug-desierto">${u.points||0}</td>
                                                <td class="py-3 px-4 text-center">
                                                    <button onclick="adminAddPoints('${u.uid}', 50)" class="bg-ug-mar/10 text-ug-mar hover:bg-ug-mar hover:text-white px-2 py-1 rounded transition text-[10px] font-bold uppercase tracking-wider" title="Regalar 50 puntos">
                                                        +50 Pts
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.createChallenge = async function(e) {
            e.preventDefault();
            const title = document.getElementById('new-c-title').value;
            const desc = document.getElementById('new-c-desc').value;
            const pts = parseInt(document.getElementById('new-c-pts').value);
            const color = document.getElementById('new-c-color').value;

            try {
                const cRef = doc(collection(db, CHALLENGES_PATH));
                await setDoc(cRef, {
                    title: title, desc: desc, points: pts, color: color,
                    icon: 'fas fa-star', type: 'text', createdAt: new Date().toISOString()
                });
                showToast("Reto creado exitosamente", "success");
                renderAdmin(); // refresh locally (though snapshot handles it too)
            } catch(err) { showToast("Error al crear reto", "error"); }
        };

        window.deleteChallenge = async function(id) {
            if(!confirm("¿Eliminar este reto definitivamente?")) return;
            try {
                await deleteDoc(doc(db, CHALLENGES_PATH, id));
                showToast("Reto eliminado", "info");
            } catch(err) { showToast("Error", "error"); }
        };

        window.adminAddPoints = async function(targetUid, amount) {
            try {
                const u = window.allUsers.find(x => x.uid === targetUid);
                if(!u) return;
                const newPts = (u.points||0) + amount;
                await updateDoc(doc(db, USERS_PATH, targetUid), { points: newPts });
                showToast(`+${amount}pts a ${u.name.split(' ')[0]}`, "success");
            } catch(err) { showToast("Error", "error"); }
        };

    </script>
</body>
</html>
