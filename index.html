<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana Internacional - Uniguajira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FIREBASE LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { uniAzul: '#62A7B4', uniAmarillo: '#EOA342', uniRosado: '#CA5E50', uniNegro: '#000000', uniFondo: '#F9FAFB' }, fontFamily: { poppins: ['Poppins', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F9FAFB; }
        .bg-pattern { background-color: #62A7B4; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
    </style>
</head>
<body class="text-uniNegro antialiased min-h-screen flex flex-col">

    <!-- CONFIGURACIÓN DE FIREBASE YA INTEGRADA -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDlrdS1CZFZGJbMFoOvL9cpNjNfYIQLdo4",
          authDomain: "semana-internacional-7280d.firebaseapp.com",
          projectId: "semana-internacional-7280d",
          storageBucket: "semana-internacional-7280d.firebasestorage.app",
          messagingSenderId: "1049667429914",
          appId: "1:1049667429914:web:2a168f5d1669d76f8d93a3",
          measurementId: "G-6HS6ET8NQC"
        };
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const ADMIN_EMAIL = 'josearregocesfreyles@gmail.com';
        
        let currentUser = null;
        let globalSettings = { act1Active: true, act2Active: true, act3Active: true, act4Active: true, act1Link: 'https://instagram.com/uniguajira' };
    </script>

    <!-- LOGIN / REGISTRO / RECUPERACIÓN -->
    <div id="auth-container" class="fixed inset-0 z-50 bg-pattern flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl border-t-4 border-uniAmarillo">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-uniAzul tracking-tight">Uniguajira</h1>
                <h2 class="text-xl font-bold text-uniRosado">Internacional</h2>
                <p class="text-sm text-gray-500 mt-2">Semana Internacional</p>
            </div>
            
            <div id="auth-error" class="mb-4 text-xs text-uniRosado text-center font-bold"></div>

            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="login-email" required placeholder="Correo Electrónico" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
                <input type="password" id="login-password" required placeholder="Contraseña" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
                <button type="submit" class="w-full py-3 bg-uniAzul text-white font-bold rounded-xl shadow-md">Ingresar</button>
                <div class="text-center mt-4">
                    <button type="button" onclick="document.getElementById('form-login').classList.add('hidden'); document.getElementById('form-register').classList.remove('hidden');" class="text-xs text-gray-500 underline">Crear cuenta nueva</button>
                </div>
            </form>

            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <input type="text" id="reg-name" required placeholder="Nombre Completo" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
                <input type="email" id="reg-email" required placeholder="Correo Electrónico" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
                <input type="text" id="reg-program" required placeholder="Programa Académico" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
                <input type="password" id="reg-password" required placeholder="Crear Contraseña" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
                <button type="submit" class="w-full py-3 bg-uniAmarillo text-uniNegro font-bold rounded-xl shadow-md">Registrarse</button>
                <div class="text-center mt-4">
                    <button type="button" onclick="document.getElementById('form-register').classList.add('hidden'); document.getElementById('form-login').classList.remove('hidden');" class="text-xs text-gray-500 underline">Volver a iniciar sesión</button>
                </div>
            </form>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-container" class="hidden flex-col min-h-screen">
        <header class="bg-uniAzul text-white shadow-md sticky top-0 z-40 border-b-4 border-uniAmarillo">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-white text-uniAzul p-2 rounded-lg font-extrabold text-xl leading-none">UI</div>
                    <div>
                        <h1 class="font-extrabold leading-none text-lg">Uniguajira Internacional</h1>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="admin-badge"></div>
                    <button onclick="logout()" class="text-xs font-bold bg-white/20 px-3 py-1.5 rounded-lg">Salir</button>
                </div>
            </div>
        </header>

        <nav class="bg-white border-b border-gray-200 shadow-sm sticky top-[60px] z-30">
            <div class="max-w-7xl mx-auto px-4 flex space-x-6 overflow-x-auto">
                <button onclick="switchSec('act')" id="nav-act" class="py-3 text-sm font-bold text-uniAzul border-b-2 border-uniAzul whitespace-nowrap">🎯 Actividades</button>
                <button onclick="switchSec('rank')" id="nav-rank" class="py-3 text-sm font-bold text-gray-500 whitespace-nowrap">🏆 Ranking</button>
                <button onclick="switchSec('prof')" id="nav-prof" class="py-3 text-sm font-bold text-gray-500 whitespace-nowrap">👤 Mi Perfil</button>
                <button onclick="switchSec('admin')" id="nav-admin" class="py-3 text-sm font-bold text-uniRosado whitespace-nowrap hidden">⚙️ MATRIZ ORI</button>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            <section id="sec-act" class="space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border-l-4 border-uniAzul">
                    <h2 class="text-2xl font-extrabold text-uniNegro">Retos Activos</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="activities-container">Cargando...</div>
            </section>

            <section id="sec-rank" class="space-y-6 hidden">
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-200">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-white text-gray-500"><tr><th class="p-4">#</th><th class="p-4">Estudiante</th><th class="p-4 text-right">Puntos</th></tr></thead>
                        <tbody id="ranking-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </section>

            <section id="sec-prof" class="space-y-6 hidden">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200 flex flex-col items-center">
                    <div class="w-20 h-20 rounded-full bg-uniAzul text-white text-3xl font-bold flex items-center justify-center mb-4" id="p-avatar">U</div>
                    <h2 id="p-name" class="text-2xl font-bold text-uniNegro">Nombre</h2>
                    <p id="p-prog" class="text-sm text-gray-600">Programa</p>
                    <div class="mt-2 inline-block px-4 py-1 bg-uniAmarillo/20 text-uniAmarillo font-extrabold rounded-full">Puntos: <span id="p-points">0</span></div>
                </div>
            </section>

            <section id="sec-admin" class="space-y-6 hidden">
                <div class="bg-uniNegro text-white p-6 rounded-2xl border-t-4 border-uniRosado">
                    <h2 class="text-2xl font-extrabold text-uniRosado">Panel de Control Matriz</h2>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-gray-200 space-y-4" id="admin-controls">
                    <!-- Dinámico -->
                </div>
            </section>
        </main>
    </div>

    <!-- LÓGICA DE BASE DE DATOS EN LA NUBE -->
    <script>
        // ESCUCHADORES EN TIEMPO REAL A LA NUBE
        function initRealtimeListeners() {
            // Escuchar cambios en la configuración global (Matriz)
            db.collection('config').doc('global').onSnapshot(doc => {
                if (doc.exists) {
                    globalSettings = doc.data();
                    renderActivities();
                    if(currentUser && currentUser.email === ADMIN_EMAIL) renderAdmin();
                } else {
                    db.collection('config').doc('global').set(globalSettings);
                }
            });

            // Escuchar cambios en el usuario actual
            if(currentUser) {
                db.collection('users').doc(currentUser.email).onSnapshot(doc => {
                    if (doc.exists) {
                        currentUser = doc.data();
                        document.getElementById('p-points').innerText = currentUser.points;
                        renderActivities();
                    }
                });
            }

            // Escuchar cambios en el ranking general
            db.collection('users').orderBy('points', 'desc').orderBy('lastTime', 'asc').onSnapshot(snapshot => {
                let html = '';
                let rank = 1;
                snapshot.forEach(doc => {
                    const u = doc.data();
                    if(u.email !== ADMIN_EMAIL) {
                        html += `<tr class="border-b border-gray-100">
                            <td class="p-4 font-bold text-gray-400">${rank++}</td>
                            <td class="p-4 font-bold text-uniAzul">${u.name}</td>
                            <td class="p-4 text-right font-extrabold text-lg">${u.points}</td>
                        </tr>`;
                    }
                });
                document.getElementById('ranking-body').innerHTML = html;
            });
        }

        async function handleRegister(e) {
            e.preventDefault();
            const em = document.getElementById('reg-email').value.toLowerCase().trim();
            const docRef = db.collection('users').doc(em);
            const doc = await docRef.get();
            
            if(doc.exists) return document.getElementById('auth-error').innerText = 'Correo ya registrado';
            
            const newUser = {
                email: em, name: document.getElementById('reg-name').value, program: document.getElementById('reg-program').value,
                password: btoa(document.getElementById('reg-password').value), points: 0, lastTime: Date.now(),
                act1: false, act2: [false,false,false,false,false], act3: false, act4: []
            };
            
            await docRef.set(newUser);
            currentUser = newUser;
            localStorage.setItem('uni_email', em); 
            showApp();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const em = document.getElementById('login-email').value.toLowerCase().trim();
            const pw = btoa(document.getElementById('login-password').value);
            
            // Logica especial para crear al admin si no existe
            if(em === ADMIN_EMAIL) {
                const adminDoc = await db.collection('users').doc(em).get();
                if(!adminDoc.exists) {
                    await db.collection('users').doc(em).set({
                        email: ADMIN_EMAIL, name: 'MATRIZ ORI', program: 'Admin', password: btoa('admin123'), points: 0, lastTime: Date.now(), act1: false, act2: [false,false,false,false,false], act3: false, act4: []
                    });
                }
            }

            const docRef = db.collection('users').doc(em);
            const doc = await docRef.get();
            
            if(!doc.exists || doc.data().password !== pw) {
                return document.getElementById('auth-error').innerText = 'Credenciales inválidas.';
            }
            
            currentUser = doc.data();
            localStorage.setItem('uni_email', em);
            showApp();
        }

        async function autoLogin() {
            const savedEmail = localStorage.getItem('uni_email');
            if(savedEmail) {
                const doc = await db.collection('users').doc(savedEmail).get();
                if(doc.exists) {
                    currentUser = doc.data();
                    showApp();
                } else {
                    localStorage.removeItem('uni_email');
                }
            }
        }

        function showApp() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('flex');
            
            const isAdmin = currentUser.email === ADMIN_EMAIL;
            document.getElementById('nav-admin').classList.toggle('hidden', !isAdmin);
            document.getElementById('p-name').innerText = currentUser.name;
            document.getElementById('p-prog').innerText = currentUser.program;
            document.getElementById('p-avatar').innerText = currentUser.name.charAt(0).toUpperCase();
            
            initRealtimeListeners();
        }

        function logout() {
            localStorage.removeItem('uni_email');
            window.location.reload();
        }

        function switchSec(s) {
            const isAdmin = currentUser.email === ADMIN_EMAIL;
            if (s === 'admin' && !isAdmin) return;
            ['act','rank','prof','admin'].forEach(x => document.getElementById('sec-'+x).classList.add('hidden'));
            ['act','rank','prof','admin'].forEach(x => {
                const nav = document.getElementById('nav-'+x);
                if(nav) nav.className = 'py-3 text-sm font-bold text-gray-500 whitespace-nowrap' + (x === 'admin' && !isAdmin ? ' hidden' : '');
            });
            document.getElementById('sec-'+s).classList.remove('hidden');
            document.getElementById('nav-'+s).className = 'py-3 text-sm font-bold text-uniAzul border-b-2 border-uniAzul whitespace-nowrap';
        }

        // --- RENDER DE ACTIVIDADES QUE REACCIONA A LA NUBE ---
        function renderActivities() {
            const cont = document.getElementById('activities-container');
            let html = '';
            
            if(globalSettings.act1Active) {
                html += `<div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm"><h3 class="font-bold text-uniAzul">Adivina la publicación</h3>
                ${currentUser.act1 ? '<p class="text-green-600 font-bold mt-2">✅ Completado</p>' : '<button onclick="completeTestAct(1)" class="w-full bg-uniAzul text-white py-2 mt-2 rounded font-bold text-sm">Validar Link</button>'}</div>`;
            }
            if(globalSettings.act2Active) {
                html += `<div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm"><h3 class="font-bold text-uniAzul">Preguntas de Internacionalización</h3><p class="text-sm mt-2 text-gray-500">Responde las preguntas de la matriz.</p></div>`;
            }
            if(globalSettings.act3Active) {
                html += `<div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm"><h3 class="font-bold text-uniAzul">Historia Internacional</h3><p class="text-sm mt-2 text-gray-500">Sube tu evidencia de historia o video.</p></div>`;
            }
            if(globalSettings.act4Active) {
                html += `<div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm"><h3 class="font-bold text-uniAzul">Palabras Ocultas</h3><p class="text-sm mt-2 text-gray-500">Busca las palabras por la universidad.</p></div>`;
            }

            if (!globalSettings.act1Active && !globalSettings.act2Active && !globalSettings.act3Active && !globalSettings.act4Active) {
                html = `<div class="col-span-2 text-center py-10"><h3 class="text-lg font-bold text-uniAzul">⏳ Actualmente no hay retos activos</h3><p class="text-sm text-gray-500">Espera instrucciones de la ORI.</p></div>`;
            }
            cont.innerHTML = html;
        }

        // --- MATRIZ ADMIN QUE GUARDA EN LA NUBE ---
        function renderAdmin() {
            const cont = document.getElementById('admin-controls');
            let html = '<h3 class="font-bold border-b pb-2">Control de Interruptores Globales</h3>';
            [1,2,3,4].forEach(i => {
                const a = globalSettings['act'+i+'Active'];
                html += `<div class="flex justify-between items-center p-3 bg-gray-50 mb-2 rounded border border-gray-100">
                    <span class="font-bold text-sm text-gray-700">Actividad ${i}</span>
                    <button onclick="toggleActCloud(${i})" class="px-3 py-1 text-white text-xs font-bold rounded shadow-sm ${a ? 'bg-uniRosado' : 'bg-uniAzul'}">${a ? 'DESACTIVAR' : 'ACTIVAR'}</button>
                </div>`;
            });
            cont.innerHTML = html;
        }

        async function toggleActCloud(i) {
            const field = 'act'+i+'Active';
            await db.collection('config').doc('global').update({
                [field]: !globalSettings[field]
            });
        }

        window.onload = autoLogin;
    </script>
</body>
</html>
